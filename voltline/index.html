<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#0b0d12">
<title>VOLTLINE</title>

<style>
:root{--bg:#0b0d12;--ink:#f8fafc;--mut:#9ca3af;--c1:#facc15;--c2:#dc2626;--c3:#facc15;--glass:rgba(12,14,20,.8);--line:rgba(255,255,255,.16);--disp:"Big Shoulders Display",Impact,"Arial Narrow",sans-serif;--ui:"Chakra Petch",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0d12;--ink:#f8fafc}}
:root[data-theme="dark"]{--bg:#0b0d12;--ink:#f8fafc}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--ui);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:3px solid var(--c3);outline-offset:3px}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
/* ---------- screens ---------- */
#ui{position:fixed;inset:0;z-index:10;pointer-events:none}
.scr{position:absolute;inset:0;display:none;pointer-events:auto;padding:max(18px,env(safe-area-inset-top)) max(22px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(22px,env(safe-area-inset-left));overflow:auto;background:linear-gradient(90deg,rgba(10,12,16,.9),rgba(10,12,16,.6) 50%,rgba(10,12,16,.1))}
.scr.on{display:block;animation:scrIn .35s cubic-bezier(.2,.9,.3,1)}
.scr.clear{background:none}
@keyframes scrIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
.logo{font:900 italic clamp(54px,11vw,128px)/.8 var(--disp);letter-spacing:.01em;background:linear-gradient(180deg,#fff 0 55%,#e5e7eb 56%,#9ca3af);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 0 #dc2626) drop-shadow(0 12px 24px rgba(0,0,0,.5));transform:skewX(-8deg);transform-origin:left}
.tag{font:700 clamp(11px,1.6vw,15px)/1 var(--ui);letter-spacing:.5em;color:var(--c2);margin:12px 0 0 6px}
h2{font:900 italic clamp(36px,6vw,64px)/.9 var(--disp);text-transform:uppercase;letter-spacing:.01em;transform:skewX(-8deg);transform-origin:left}
h3{font:900 italic 26px/1 var(--disp);text-transform:uppercase;letter-spacing:.02em}
.k{font:700 12px/1 var(--ui);letter-spacing:.3em;color:var(--c1);text-transform:uppercase}
.mut{color:var(--mut)}.sm{font-size:13px}
.nav{display:flex;flex-direction:column;align-items:flex-start;gap:2px;margin-top:clamp(18px,4vh,40px)}
.nb{position:relative;display:flex;align-items:baseline;gap:16px;padding:6px 14px 6px 6px;font:900 italic clamp(30px,5.4vh,52px)/1 var(--disp);text-transform:uppercase;color:transparent;-webkit-text-stroke:1.5px rgba(226,232,255,.7);transition:color .15s,transform .2s,-webkit-text-stroke-color .15s}
.nb small{font:700 12px/1 var(--ui);letter-spacing:.2em;color:var(--mut);-webkit-text-stroke:0;opacity:0;transition:opacity .2s}
.nb::before{content:"";position:absolute;left:-10px;top:12%;bottom:12%;width:5px;background:var(--c2);transform:scaleY(0);transition:transform .2s;border-radius:3px;}
.nb:hover,.nb:focus-visible{color:#fff;-webkit-text-stroke-color:transparent;transform:translateX(10px);outline:none}
.nb:hover::before,.nb:focus-visible::before{transform:scaleY(1)}.nb:hover small,.nb:focus-visible small{opacity:1}
.nb.main{color:#fff;-webkit-text-stroke:0;font-size:clamp(40px,7.5vh,72px);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:700 14px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;padding:13px 20px;border-radius:10px;border:1.5px solid var(--line);background:rgba(255,255,255,.04);transition:background .15s,border-color .15s}
.btn:hover,.btn:focus-visible{border-color:var(--c1);background:rgba(250,204,21,.1);outline:none}
.btn.go{background:var(--c2);border-color:transparent;color:#fff;font-size:17px;padding:16px 30px;box-shadow:0 10px 26px -10px rgba(220,38,38,.8);font-style:italic}
.btn.go:hover,.btn.go:focus-visible{filter:brightness(1.12);outline:3px solid var(--c3);outline-offset:3px}
.btn[disabled]{opacity:.35;pointer-events:none}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
.cred{font:700 15px/1 var(--ui);letter-spacing:.12em;padding:9px 14px;border-radius:999px;border:1px solid rgba(253,224,71,.4);color:var(--c3);background:rgba(253,224,71,.07)}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:18px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.grid{display:grid;gap:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:16px}
.card{position:relative;text-align:left;padding:16px;border-radius:14px;border:1.5px solid var(--line);background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.01));min-height:120px;display:flex;flex-direction:column;gap:6px;transition:transform .15s,border-color .15s,box-shadow .2s;overflow:hidden}
.card:hover,.card:focus-visible{transform:translateY(-3px);border-color:var(--cc,var(--c1));box-shadow:0 14px 34px -14px var(--cc,var(--c1));outline:none}
.card .cn{font:900 italic 30px/1 var(--disp);text-transform:uppercase}
.card .cs{font:500 13px/1.35 var(--ui);color:var(--mut)}
.card .cx{margin-top:auto;font:700 11px/1 var(--ui);letter-spacing:.18em;color:var(--cc,var(--c1))}
.card.lock{opacity:.45}.card.lock .cx{color:var(--mut)}
.card .bar{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--cc,var(--c1));box-shadow:0 0 14px var(--cc,var(--c1))}
.card.sel{border-color:#fff;box-shadow:0 0 0 2px var(--cc,var(--c1)) inset}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{padding:10px 16px;font:700 13px/1 var(--ui);letter-spacing:.12em;color:var(--mut)}
.seg button.on{background:var(--c1);color:#111}
.seg button[disabled]{opacity:.35}
.foot{position:absolute;left:max(22px,env(safe-area-inset-left));right:max(22px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:flex-end;gap:12px;font:700 11px/1.4 var(--ui);letter-spacing:.2em;color:var(--mut);pointer-events:none}
.foot>*{pointer-events:auto}
/* garage */
.gar{display:grid;grid-template-columns:minmax(260px,420px) 1fr;gap:20px;margin-top:14px}
.stat{display:grid;grid-template-columns:90px 1fr;gap:10px;align-items:center;font:700 12px/1 var(--ui);letter-spacing:.15em;color:var(--mut);margin:7px 0}
.stat i{display:block;height:8px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}.stat i b{display:block;height:100%;background:linear-gradient(90deg,#facc15,#dc2626)}
.sw{display:flex;flex-wrap:wrap;gap:8px}.sw button{width:34px;height:34px;border-radius:9px;border:2px solid rgba(255,255,255,.15);background:var(--c)}.sw button.on{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.2)}.sw button.lk{opacity:.3}
/* results */
table.res{width:100%;border-collapse:collapse;font:700 14px/1 var(--ui);margin-top:14px}
.res td{padding:10px 8px;border-bottom:1px solid rgba(255,255,255,.07)}.res tr.me td{background:rgba(244,114,182,.13)}.res td.p{font:900 italic 26px/1 var(--disp);width:44px}.res td.r{text-align:right;color:var(--mut)}
.res i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;vertical-align:middle}
/* settings */
.set{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.06);font:700 14px/1.2 var(--ui)}
.set small{display:block;font:500 12px/1.3 var(--ui);color:var(--mut);margin-top:3px}
.set input[type=range]{width:min(220px,40vw);accent-color:var(--c2)}
/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;z-index:5;pointer-events:none;display:none;font-family:var(--ui)}
#hud.on{display:block}
#hPos{position:absolute;left:max(18px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));display:flex;align-items:baseline;gap:4px;text-shadow:0 2px 18px rgba(0,0,0,.6)}
#hPos b{font:900 italic clamp(60px,11vh,110px)/.8 var(--disp);color:#fff;text-shadow:0 4px 0 #dc2626,0 6px 18px rgba(0,0,0,.5)}
#hPos small{font:900 italic 30px/1 var(--disp);color:var(--mut)}
#hTR{position:absolute;right:max(18px,env(safe-area-inset-right));top:max(14px,env(safe-area-inset-top));text-align:right}
#hLap{font:900 italic 34px/1 var(--disp)}
#hTime{font:700 22px/1.3 var(--ui);letter-spacing:.05em}
#hBest,#hGhost{font:700 12px/1.5 var(--ui);letter-spacing:.16em;color:var(--mut)}
#hMap{margin-top:10px;width:150px;height:150px;opacity:.95;filter:drop-shadow(0 0 8px rgba(0,0,0,.6))}
#hSpeed{position:absolute;right:max(22px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));width:190px;height:190px}
#hArc{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 225deg,#f8fafc 0,#dc2626 calc(var(--p,0)*270deg),rgba(255,255,255,.08) calc(var(--p,0)*270deg),rgba(255,255,255,.08) 270deg,transparent 270deg);-webkit-mask:radial-gradient(circle,transparent 62%,#000 63%);mask:radial-gradient(circle,transparent 62%,#000 63%)}
#hSpd{position:absolute;left:0;right:0;top:56px;text-align:center;font:900 italic 64px/1 var(--disp)}
#hUnit{position:absolute;left:0;right:0;top:122px;text-align:center;font:700 11px/1 var(--ui);letter-spacing:.3em;color:var(--mut)}
.bst{position:absolute;right:max(22px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));transform:translateY(-200px);width:190px;height:16px;border-radius:4px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.2);overflow:hidden}.bst span{position:absolute;left:8px;top:1px;z-index:1;font:700 10px/14px var(--ui);letter-spacing:.25em;color:#fff;mix-blend-mode:difference}#hGear{position:absolute;left:0;right:0;top:142px;text-align:center;font:900 italic 26px/1 var(--disp);color:#facc15}#hDraft{position:absolute;left:50%;bottom:22vh;transform:translateX(-50%);font:700 12px/1 var(--ui);letter-spacing:.35em;color:#93c5fd;opacity:0;transition:opacity .3s}
.bst::after{content:"";position:absolute;inset:0;transform-origin:left;transform:scaleX(var(--d,0));background:linear-gradient(90deg,#1d4ed8,#60a5fa)}.bst.full::after{background:linear-gradient(90deg,#2563eb,#93c5fd)}.bst.on::after{background:linear-gradient(90deg,#60a5fa,#fff)}
.bst.lv1::after{background:#38bdf8;box-shadow:0 0 12px #38bdf8}.bst.lv2::after{background:#fb923c;box-shadow:0 0 14px #fb923c}.bst.on{box-shadow:0 0 18px #fde047}
#hItem{position:absolute;left:max(18px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));width:96px;height:96px;border-radius:18px;border:2px solid rgba(255,255,255,.18);background:rgba(7,3,15,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font:700 10px/1 var(--ui);letter-spacing:.2em}
#hItem i{width:44px;height:44px;color:var(--c);filter:drop-shadow(0 0 10px var(--c))}#hItem i svg{width:100%;height:100%}
#hItem .mt{color:var(--mut)}
#hShield{position:absolute;inset:0;box-shadow:inset 0 0 90px rgba(34,211,238,.45);opacity:0;transition:opacity .25s}
#hMsg{position:absolute;left:0;right:0;top:24vh;text-align:center;font:900 italic clamp(34px,6vw,64px)/1 var(--disp);letter-spacing:.03em;opacity:0;transform:scale(.8);transition:opacity .2s,transform .25s;text-shadow:0 4px 28px rgba(0,0,0,.6)}
#hMsg.on{opacity:1;transform:none}#hMsg.sm{font-size:clamp(18px,2.6vw,28px);top:30vh;letter-spacing:.06em}
#hCount{position:absolute;left:0;right:0;top:32vh;text-align:center;font:900 italic 160px/1 var(--disp);opacity:0;color:#fff;text-shadow:0 6px 0 #dc2626}
#hCount.on{animation:cnt .9s ease-out}#hCount.go{color:var(--c3);text-shadow:0 0 50px rgba(253,224,71,.9)}
@keyframes cnt{0%{opacity:0;transform:scale(1.8)}20%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(.9)}}
#hPause{position:absolute;left:50%;top:max(14px,env(safe-area-inset-top));transform:translateX(-50%);pointer-events:auto;width:44px;height:44px;border-radius:12px;background:rgba(7,3,15,.5);border:1.5px solid rgba(255,255,255,.2);display:none}
#hPause::before,#hPause::after{content:"";position:absolute;top:13px;width:5px;height:18px;background:#fff;border-radius:2px}#hPause::before{left:14px}#hPause::after{right:14px}
body.touch #hPause{display:block}
/* touch controls */
#touch{position:fixed;inset:0;z-index:6;display:none;pointer-events:none}
body.touch.racing #touch{display:block}
#tSteer{position:absolute;left:0;top:30%;bottom:0;width:50%;pointer-events:auto}
#tKnob{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.05);display:none}
#tKnob i{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px;border-radius:50%;background:rgba(255,255,255,.35)}
.tb{position:absolute;pointer-events:auto;width:84px;height:84px;border-radius:50%;border:2px solid rgba(255,255,255,.3);background:rgba(7,3,15,.45);font:700 11px/1 var(--ui);letter-spacing:.14em;display:flex;align-items:center;justify-content:center}
.tb.on{background:rgba(220,38,38,.5);border-color:#fca5a5}
#tDrift{right:max(24px,env(safe-area-inset-right));bottom:max(220px,calc(env(safe-area-inset-bottom) + 200px));width:96px;height:96px}
#tItem{right:max(130px,calc(env(safe-area-inset-right) + 110px));bottom:max(250px,calc(env(safe-area-inset-bottom) + 230px))}
#tBrake{right:max(130px,calc(env(safe-area-inset-right) + 110px));bottom:max(150px,calc(env(safe-area-inset-bottom) + 130px));width:70px;height:70px}
@media (max-width:760px),(max-height:520px){#hSpeed{width:130px;height:130px}#hSpd{top:38px;font-size:44px}#hUnit{top:84px}.bst{width:130px;transform:translateY(-140px)}#hItem{width:74px;height:74px}#hMap{width:110px;height:110px}#hLap{font-size:26px}#hTime{font-size:16px}.gar{grid-template-columns:1fr}#tDrift{bottom:160px}#tItem{bottom:180px;right:110px}#tBrake{bottom:96px;right:110px}}

/* phones: speed in the bottom middle, big thumb buttons bottom right */
body.touch #hSpeed{left:max(14px,env(safe-area-inset-left));right:auto;transform:none;bottom:max(6px,env(safe-area-inset-bottom));width:120px;height:120px}
body.touch #hSpd{top:30px;font-size:40px}body.touch #hUnit{top:70px}body.touch #hGear{top:86px;font-size:18px}
body.touch .bst{left:max(14px,env(safe-area-inset-left));right:auto;width:120px;transform:none;bottom:max(130px,calc(env(safe-area-inset-bottom) + 126px))}
body.touch #hMap{width:96px;height:96px}
body.touch #tDrift{right:max(18px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));width:104px;height:104px}
body.touch #tItem{right:max(28px,calc(env(safe-area-inset-right) + 10px));bottom:max(134px,calc(env(safe-area-inset-bottom) + 130px));width:78px;height:78px}
body.touch #tBrake{right:max(134px,calc(env(safe-area-inset-right) + 128px));bottom:max(22px,env(safe-area-inset-bottom));width:74px;height:74px}
body.touch #hItem{bottom:auto;top:max(110px,calc(env(safe-area-inset-top) + 100px));width:70px;height:70px}
/* editor */
#edCv{display:block;width:100%;height:100%;border-radius:14px;background:#14171d;touch-action:none;cursor:crosshair}
.ed{display:grid;grid-template-columns:1fr 290px;gap:16px;height:calc(100% - 70px);margin-top:12px}
@media (max-width:860px){.ed{grid-template-columns:1fr;grid-template-rows:1fr auto}}
/* intro + studio */
#intro{position:fixed;inset:0;z-index:50;background:#030208;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .8s}
#intro .pr{font:700 12px/1 var(--ui);letter-spacing:.6em;color:var(--mut);opacity:0;animation:fadeIn 1s .9s forwards}
@keyframes fadeIn{to{opacity:1}}
.dw{display:inline-flex;align-items:center;gap:.28em;font-size:40px;line-height:1}
.dw-e{width:1.9em;height:1.9em;flex:none;overflow:visible}
.dw-t{text-align:left}.dw-1{font:900 italic 1em/.9 var(--disp);letter-spacing:.04em;color:#fff}.dw-2{font:700 .26em var(--ui);letter-spacing:.78em;color:#7dd3fc;margin-top:.35em}
#intro .dw-w{stroke-dasharray:1;stroke-dashoffset:1;animation:dwd 1.1s .1s ease-out forwards}#intro .dw-w2{stroke-dasharray:1;stroke-dashoffset:1;animation:dwd .9s .45s ease-out forwards}
@keyframes dwd{to{stroke-dashoffset:0}}
#toast{position:fixed;left:50%;top:max(16px,env(safe-area-inset-top));transform:translate(-50%,-30px);z-index:30;padding:11px 18px;border-radius:10px;background:rgba(10,8,24,.92);border:1px solid var(--line);font:700 13px/1 var(--ui);letter-spacing:.1em;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud">
  <div id="hShield"></div>
  <div id="hPos"></div>
  <div id="hTR"><div id="hLap">LAP 1/3</div><div id="hTime">0:00.000</div><div id="hBest"></div><div id="hGhost"></div><canvas id="hMap" width="150" height="150"></canvas></div>
  <div id="hSpeed"><div id="hArc"></div><div id="hSpd">0</div><div id="hUnit">KM/H</div><div id="hGear">N</div></div>
  <div class="bst" id="hBoost"><span>NITRO</span></div><div id="hDraft">SLIPSTREAM</div>
  <div id="hItem"><span class="mt">NO ITEM</span></div>
  <div id="hMsg"></div><div id="hCount"></div>
  <button id="hPause" aria-label="Pause"></button>
</div>
<div id="touch">
  <div id="tSteer"><div id="tKnob"><i></i></div></div>
  <button class="tb" id="tDrift">DRIFT</button><button class="tb" id="tItem">NITRO</button><button class="tb" id="tBrake">BRAKE</button>
</div>
<div id="ui"></div>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){'use strict';
// ================= VOLTLINE - core: helpers, save data, settings, input =================
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
const wrapA = a => { while (a > Math.PI) a -= TAU; while (a < -Math.PI) a += TAU; return a; };
function seeded(s) { s = (s >>> 0) || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
const fmtT = t => { if (!isFinite(t) || t <= 0) return '--:--.---'; const m = Math.floor(t / 60), s = t - m * 60; return m + ':' + (s < 10 ? '0' : '') + s.toFixed(3); };
const fmtN = n => Math.round(n).toLocaleString('en-US');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const STUDIO = 'Driftwire Games', GAME = 'VOLTLINE', VER = 'V1';
const IS_TOUCH = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;

// ---------- save ----------
const SKEY = 'voltline_save_v2';
