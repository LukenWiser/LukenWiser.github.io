<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Cubelands</title>
<meta name="description" content="Cubelands: an infinite voxel sandbox that runs in your browser. Dig, build and explore.">
<meta name="theme-color" content="#101418">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#101418;color:#fff;font:14px/1.4 ui-monospace,Menlo,Consolas,monospace;
  user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
#hud{position:fixed;inset:0;pointer-events:none}
#cross{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;mix-blend-mode:difference}
#cross:before,#cross:after{content:"";position:absolute;background:#fff}
#cross:before{left:10px;top:0;width:2px;height:22px}
#cross:after{top:10px;left:0;height:2px;width:22px}
#dbg{position:absolute;left:calc(8px + env(safe-area-inset-left));top:calc(6px + env(safe-area-inset-top));text-shadow:1px 1px 0 #000;font-size:12px;opacity:.9}
#hotbar{position:absolute;left:50%;bottom:calc(8px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:0;
  background:rgba(0,0,0,.45);border:2px solid #111;pointer-events:auto}
.slot{width:min(10.4vw,54px);height:min(10.4vw,54px);border:2px solid #777;border-right-color:#333;border-bottom-color:#333;
  display:flex;align-items:center;justify-content:center;background:rgba(120,120,120,.35)}
.slot canvas{width:82%;height:82%;image-rendering:pixelated}
.slot.on{border-color:#fff;outline:2px solid #fff;outline-offset:-1px;background:rgba(255,255,255,.25);z-index:1}
#label{position:absolute;left:50%;bottom:calc(min(10.4vw,54px) + 22px + env(safe-area-inset-bottom));transform:translateX(-50%);
  text-shadow:1px 1px 0 #000;transition:opacity .4s;opacity:0;white-space:nowrap}
#load{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-size:18px;text-shadow:2px 2px 0 #000}
.tb{position:absolute;pointer-events:auto;width:62px;height:62px;border-radius:50%;background:rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.55);
  display:none;align-items:center;justify-content:center;font-size:24px;color:#fff}
.tb.act{background:rgba(255,255,255,.35)}
body.touch .tb{display:flex}
#bJump{right:calc(18px + env(safe-area-inset-right));bottom:calc(100px + env(safe-area-inset-bottom))}
#bDown{right:calc(18px + env(safe-area-inset-right));bottom:calc(172px + env(safe-area-inset-bottom));visibility:hidden}
#bFly{right:calc(90px + env(safe-area-inset-right));bottom:calc(100px + env(safe-area-inset-bottom));font-size:13px}
#bInv{right:calc(10px + env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top));width:46px;height:46px;font-size:20px}
#bPause{right:calc(64px + env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top));width:46px;height:46px;font-size:16px}
#joy{position:absolute;width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.4);background:rgba(0,0,0,.2);display:none;margin:-60px 0 0 -60px}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,255,255,.5)}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(8,12,18,.62);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);padding:16px;text-align:center;overflow:auto}
h1{font-size:clamp(34px,9vw,68px);margin:0 0 4px;letter-spacing:.08em;color:#fff;text-shadow:4px 4px 0 #2a5a1e,8px 8px 0 rgba(0,0,0,.5)}
.sub{opacity:.8;margin-bottom:18px}
button{font:inherit;font-size:16px;color:#fff;background:#6b6b6b;border:2px solid #000;box-shadow:inset 2px 2px 0 #a6a6a6,inset -2px -2px 0 #444;
  padding:11px 18px;margin:5px;min-width:240px;cursor:pointer;text-shadow:1px 1px 0 #222}
button:hover,button:active{background:#7c8fd0}
.row{display:flex;align-items:center;justify-content:center}
.row button{min-width:48px}
.row span{min-width:140px}
#help{margin-top:14px;font-size:12px;opacity:.85;max-width:520px;line-height:1.7}
#inv{display:none}
#invgrid{display:grid;grid-template-columns:repeat(6,min(13vw,62px));gap:4px;background:#c6c6c6;border:3px solid #000;padding:10px;
  box-shadow:inset 3px 3px 0 #fff,inset -3px -3px 0 #555}
#invgrid .slot{width:auto;height:min(13vw,62px);background:#8b8b8b;cursor:pointer}
#inv p{margin:10px 0}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="cross"></div>
  <div id="dbg"></div>
  <div id="load">Building terrain…</div>
  <div id="label"></div>
  <div id="joy"><div id="knob"></div></div>
  <div class="tb" id="bPause">II</div>
  <div class="tb" id="bInv">▦</div>
  <div class="tb" id="bFly">FLY</div>
  <div class="tb" id="bDown">▼</div>
  <div class="tb" id="bJump">▲</div>
  <div id="hotbar"></div>
</div>
<div class="ov" id="inv"><p>Pick a block for the selected slot</p><div id="invgrid"></div><p><button id="invClose">Close</button></p></div>
<div class="ov" id="menu">
  <h1>CUBELANDS</h1>
  <div class="sub">an endless world of blocks</div>
  <button id="play">Play</button>
  <div class="row"><button id="rdm">−</button><span id="rdl"></span><button id="rdp">+</button></div>
  <button id="neww">New world</button>
  <div id="help"></div>
</div>
<script>
'use strict';
// ====================================================================== constants
const CW=16,CH=128,SEA=62,PAD=7;
const RX=CW+2*PAD,RZ=RX,RY=CH+3,RXZ=RX*RZ,RN=RXZ*RY;
const $=id=>document.getElementById(id);
function rnd32(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

// ====================================================================== procedural textures
const atlasC=document.createElement('canvas');atlasC.width=atlasC.height=256;
const actx=atlasC.getContext('2d');const aimg=actx.createImageData(256,256);
const T={};let tcount=0;
function tex(name,gen){
  const id=tcount++;T[name]=id;const r=rnd32(id*7919+13);const px=gen(r);
  const ox=(id%16)*16,oy=(id>>4)*16;
  for(let y=0;y<16;y++)for(let x=0;x<16;x++){
    const c=px(x,y),i=((oy+y)*256+ox+x)*4;
    aimg.data[i]=c[0];aimg.data[i+1]=c[1];aimg.data[i+2]=c[2];aimg.data[i+3]=c[3]===undefined?255:c[3];
  }
}
const v=(c,d)=>[c[0]+d,c[1]+d,c[2]+d,c[3]];
const speck=(base,amp)=>r=>()=>v(base,(r()-.5)*amp);
const NONE=[0,0,0,0];
const dirtPx=r=>()=>r()<.07?[98,70,47]:v([134,96,67],(r()-.5)*26);
const stoneG=r=>{const row=[];for(let i=0;i<16;i++)row.push(r());return(x,y)=>v([127,127,127],(r()-.5)*14+(row[(y+(x>>2))&15]-.5)*24)};
const topped=(col,amp,lo)=>r=>{const d=[],dp=dirtPx(r);for(let i=0;i<16;i++)d.push(lo+(r()*3|0));return(x,y)=>y<d[x]?v(col,(r()-.5)*amp):dp()};
const ore=col=>r=>{const st=stoneG(r),sp=new Set();for(let i=0;i<6;i++){const cx=1+(r()*13|0),cy=1+(r()*13|0);sp.add(cy*16+cx);
  if(r()<.8)sp.add(cy*16+cx+1);if(r()<.8)sp.add(cy*16+16+cx);if(r()<.5)sp.add(cy*16+17+cx)}
  return(x,y)=>sp.has(y*16+x)?v(col,(r()-.5)*36):st(x,y)};
const rings=(bark,wood)=>r=>(x,y)=>{const d=Math.max(Math.abs(x-7.5),Math.abs(y-7.5));return d>6.6?v(bark,(r()-.5)*14):v(wood,((d|0)%2?-20:0)+(r()-.5)*8)};
const leaf=base=>r=>()=>r()<.2?NONE:v(base,(r()-.5)*46);
const flower=(pet,ctr)=>()=>(x,y)=>{const dx=x-7.5,dy=y-5,d=dx*dx+dy*dy;if(d<1.6)return ctr;if(d<8.5)return pet;
  if(y>=7&&x===7)return[52,122,42];if(y===11&&(x===6||x===8))return[64,140,50];if(y===12&&x===9)return[64,140,50];return NONE};
tex('grass_top',speck([92,158,52],34));
tex('grass_side',topped([92,158,52],34,2));
tex('dirt',dirtPx);
tex('stone',stoneG);
tex('sand',speck([219,207,163],14));
tex('water',r=>()=>v([40,92,200,168],(r()-.5)*14));
tex('log_side',r=>{const c=[];for(let i=0;i<16;i++)c.push(r());return x=>v([104,82,50],(c[x]-.5)*38+(r()-.5)*12)});
tex('log_top',rings([104,82,50],[178,144,88]));
tex('leaves',leaf([52,118,34]));
tex('planks',r=>{const rr=[];for(let i=0;i<16;i++)rr.push(r());return(x,y)=>y%4===3?[112,88,50]:(x===((y>>2)%2?4:12)?[122,96,56]:v([166,134,80],(rr[y]-.5)*16+(r()-.5)*10))});
tex('cobble',r=>{const pts=[];for(let i=0;i<10;i++)pts.push([r()*16,r()*16,r()]);return(x,y)=>{let d1=99,d2=99,s=0;
  for(const p of pts){let dx=Math.abs(x-p[0]);dx=Math.min(dx,16-dx);let dy=Math.abs(y-p[1]);dy=Math.min(dy,16-dy);const d=Math.hypot(dx,dy);
    if(d<d1){d2=d1;d1=d;s=p[2]}else if(d<d2)d2=d}
  return d2-d1<1.1?v([72,72,72],(r()-.5)*10):v([124,124,124],(s-.5)*52+(r()-.5)*12)}});
tex('bedrock',speck([72,72,72],95));
tex('snow',speck([240,246,250],8));
tex('snow_side',topped([240,246,250],8,3));
tex('coal',ore([34,34,34]));tex('iron',ore([216,175,147]));tex('gold',ore([250,222,70]));tex('diamond',ore([93,236,245]));
tex('glass',()=>(x,y)=>(x===0||y===0||x===15||y===15)?[205,228,238]:((x+y===6||x+y===7)&&x>1&&x<6?[238,247,252]:NONE));
tex('brick',r=>(x,y)=>{const row=y>>2;return(y%4===3||(x+(row%2?4:0))%8===7)?v([190,184,172],(r()-.5)*10):v([150,74,58],(r()-.5)*24)});
tex('lantern',()=>(x,y)=>{const d=Math.max(Math.abs(x-7.5),Math.abs(y-7.5));return d>6.6?[110,72,30]:(x%5===0||y%5===0?[196,136,52]:v([255,226,140],(7-d)*4))});
tex('gravel',r=>()=>{const t=r();return v([t<.33?100:t<.6?142:122,t<.33?98:t<.6?138:119,t<.33?96:t<.6?134:116],(r()-.5)*22)});
tex('tallgrass',r=>{const h=[];for(let i=0;i<16;i++)h.push(r()<.55?4+(r()*11|0):0);return(x,y)=>(15-y)<h[x]?v([74,146,48],(r()-.5)*44):NONE});
tex('rose',flower([214,40,46],[250,214,70]));
tex('daisy',flower([246,246,240],[246,200,50]));
tex('birch_side',r=>{const m=new Set();for(let i=0;i<8;i++){const yy=r()*16|0,xx=r()*13|0,l=2+(r()*3|0);for(let j=0;j<l;j++)m.add(yy*16+xx+j)}
  return(x,y)=>m.has(y*16+x)?[52,50,46]:v([218,216,206],(r()-.5)*12)});
tex('birch_top',rings([210,208,198],[196,176,122]));
tex('birch_leaves',leaf([104,150,66]));
tex('cactus_side',r=>(x,y)=>x%4===1?v([40,100,40],(r()-.5)*8):(x%4===3&&y%4===2?[224,228,190]:v([60,132,54],(r()-.5)*14)));
tex('cactus_top',rings([40,100,40],[84,152,68]));
tex('sandstone',r=>(x,y)=>v([216,200,150],(y%5===0?-18:0)+(r()-.5)*8));
tex('ice',r=>(x,y)=>v([160,196,250,214],((x+y)%7===0?14:0)+(r()-.5)*8));
tex('pine_leaves',leaf([38,84,52]));
tex('stonebrick',r=>(x,y)=>{const row=y>>3;return(y%8===7||(x+(row%2?8:0))%16===15)?v([80,80,80],(r()-.5)*8):v([130,130,130],(r()-.5)*14)});
tex('select',()=>(x,y)=>(x===0||y===0||x===15||y===15)?[0,0,0,105]:NONE);
{const r=rnd32(99),seq=[];for(let w=0;w<7;w++){let x=7+(r()*2|0),y=7+(r()*2|0);const a=r()*6.283;
  for(let s=0;s<13;s++){seq.push(y*16+x);const b=a+(r()-.5)*1.8;x=Math.max(0,Math.min(15,Math.round(x+Math.cos(b))));y=Math.max(0,Math.min(15,Math.round(y+Math.sin(b))))}}
 const order=[];for(let s=0;s<13;s++)for(let w=0;w<7;w++)order.push(seq[w*13+s]);
 for(let k=0;k<5;k++){const set=new Set(order.slice(0,(k+1)*order.length/5|0));tex('crack'+k,()=>(x,y)=>set.has(y*16+x)?[0,0,0,175]:NONE)}}
actx.putImageData(aimg,0,0);

// ====================================================================== blocks
const NB=32,TOP=new Uint8Array(NB),BOT=new Uint8Array(NB),SIDE=new Uint8Array(NB),OPQ=new Uint8Array(NB),SOLID=new Uint8Array(NB),
  KIND=new Uint8Array(NB),LIGHT=new Uint8Array(NB),ATT=new Uint8Array(NB),HARD=new Float32Array(NB),NAME=[];
function def(id,name,t,b,s,o={}){NAME[id]=name;TOP[id]=T[t];BOT[id]=T[b];SIDE[id]=T[s];OPQ[id]=o.clear?0:1;SOLID[id]=o.pass?0:1;
  KIND[id]=o.kind|0;HARD[id]=o.h===undefined?1:o.h;LIGHT[id]=o.light|0;ATT[id]=o.att|0}
const AIR=0,GRASS=1,DIRT=2,STONE=3,SAND=4,WATER=5,LOG=6,LEAVES=7,PLANKS=8,COBBLE=9,BEDROCK=10,SNOWGRASS=11,COAL=12,IRON=13,GOLD=14,DIAMOND=15,
  GLASS=16,BRICK=17,LANTERN=18,GRAVEL=19,TALLGRASS=20,ROSE=21,DAISY=22,BIRCHLOG=23,BIRCHLEAVES=24,CACTUS=25,SANDSTONE=26,ICE=27,PINELEAVES=28,SNOW=29,STONEBRICK=30;
def(GRASS,'Grass','grass_top','dirt','grass_side',{h:.6});
def(DIRT,'Dirt','dirt','dirt','dirt',{h:.5});
def(STONE,'Stone','stone','stone','stone',{h:1.5});
def(SAND,'Sand','sand','sand','sand',{h:.5});
def(WATER,'Water','water','water','water',{clear:1,pass:1,kind:2,att:2});
def(LOG,'Oak Log','log_top','log_top','log_side',{h:1.1});
def(LEAVES,'Oak Leaves','leaves','leaves','leaves',{clear:1,h:.25,att:1});
def(PLANKS,'Planks','planks','planks','planks',{h:1});
def(COBBLE,'Cobblestone','cobble','cobble','cobble',{h:1.6});
def(BEDROCK,'Bedrock','bedrock','bedrock','bedrock',{h:1e9});
def(SNOWGRASS,'Snowy Grass','snow','dirt','snow_side',{h:.6});
def(COAL,'Coal Ore','coal','coal','coal',{h:1.8});
def(IRON,'Iron Ore','iron','iron','iron',{h:2});
def(GOLD,'Gold Ore','gold','gold','gold',{h:2});
def(DIAMOND,'Diamond Ore','diamond','diamond','diamond',{h:2.4});
def(GLASS,'Glass','glass','glass','glass',{clear:1,h:.3});
def(BRICK,'Bricks','brick','brick','brick',{h:1.6});
def(LANTERN,'Lantern','lantern','lantern','lantern',{h:.4,light:15});
def(GRAVEL,'Gravel','gravel','gravel','gravel',{h:.6});
def(TALLGRASS,'Tall Grass','tallgrass','tallgrass','tallgrass',{clear:1,pass:1,kind:1,h:0});
def(ROSE,'Rose','rose','rose','rose',{clear:1,pass:1,kind:1,h:0});
def(DAISY,'Daisy','daisy','daisy','daisy',{clear:1,pass:1,kind:1,h:0});
def(BIRCHLOG,'Birch Log','birch_top','birch_top','birch_side',{h:1.1});
def(BIRCHLEAVES,'Birch Leaves','birch_leaves','birch_leaves','birch_leaves',{clear:1,h:.25,att:1});
def(CACTUS,'Cactus','cactus_top','cactus_top','cactus_side',{h:.4});
def(SANDSTONE,'Sandstone','sandstone','sandstone','sandstone',{h:1.2});
def(ICE,'Ice','ice','ice','ice',{clear:1,kind:2,h:.5});
def(PINELEAVES,'Pine Needles','pine_leaves','pine_leaves','pine_leaves',{clear:1,h:.25,att:1});
def(SNOW,'Snow','snow','snow','snow',{h:.4});
def(STONEBRICK,'Stone Bricks','stonebrick','stonebrick','stonebrick',{h:1.6});
const PALETTE=[GRASS,DIRT,STONE,COBBLE,STONEBRICK,BRICK,PLANKS,LOG,BIRCHLOG,LEAVES,BIRCHLEAVES,PINELEAVES,SAND,SANDSTONE,GRAVEL,GLASS,LANTERN,SNOW,ICE,
  CACTUS,COAL,IRON,GOLD,DIAMOND,TALLGRASS,ROSE,DAISY,SNOWGRASS,WATER,BEDROCK];

// ====================================================================== save data
const SAVE='cubelands_v1';let save={};
try{save=JSON.parse(localStorage.getItem(SAVE)||'{}')||{}}catch(e){save={}}
let seed=save.seed||(Math.random()*2147483647|0)||1;
const edits=new Map();
if(save.edits)for(const k in save.edits){const m=new Map(),a=save.edits[k];for(let i=0;i<a.length;i+=2)m.set(a[i],a[i+1]);edits.set(+k,m)}
let saveDirty=false;
function doSave(){
  const e={};for(const [k,m] of edits){const a=[];for(const [i,b] of m)a.push(i,b);e[k]=a}
  try{localStorage.setItem(SAVE,JSON.stringify({seed,edits:e,p:[P.x,P.y,P.z,yaw,pitch,flying?1:0],time:dayT,slots,sel,rd:RD}))}catch(err){}
  saveDirty=false;
}

// ====================================================================== noise + terrain
const perm=new Uint8Array(512);
{const r=rnd32(seed),p=new Uint8Array(256);for(let i=0;i<256;i++)p[i]=i;
 for(let i=255;i>0;i--){const j=r()*(i+1)|0,t=p[i];p[i]=p[j];p[j]=t}for(let i=0;i<512;i++)perm[i]=p[i&255]}
const fade=t=>t*t*t*(t*(t*6-15)+10);
function g2(h,x,y){switch(h&7){case 0:return x+y;case 1:return x-y;case 2:return y-x;case 3:return -x-y;case 4:return x;case 5:return -x;case 6:return y;default:return -y}}
function n2(x,y){const X=Math.floor(x),Y=Math.floor(y);x-=X;y-=Y;const xi=X&255,yi=Y&255,u=fade(x),w=fade(y),a=perm[xi]+yi,b=perm[xi+1]+yi;
  const p=g2(perm[a],x,y),q=g2(perm[b],x-1,y),r=g2(perm[a+1],x,y-1),s=g2(perm[b+1],x-1,y-1);
  const t0=p+(q-p)*u,t1=r+(s-r)*u;return t0+(t1-t0)*w}
function g3(h,x,y,z){h&=15;const u=h<8?x:y,w=h<4?y:(h===12||h===14)?x:z;return((h&1)?-u:u)+((h&2)?-w:w)}
function n3(x,y,z){const X=Math.floor(x),Y=Math.floor(y),Z=Math.floor(z);x-=X;y-=Y;z-=Z;const xi=X&255,yi=Y&255,zi=Z&255,u=fade(x),w=fade(y),s=fade(z);
  const A=perm[xi]+yi,AA=perm[A]+zi,AB=perm[A+1]+zi,B=perm[xi+1]+yi,BA=perm[B]+zi,BB=perm[B+1]+zi;
  const a0=g3(perm[AA],x,y,z),a1=g3(perm[BA],x-1,y,z),a2=g3(perm[AB],x,y-1,z),a3=g3(perm[BB],x-1,y-1,z);
  const b0=g3(perm[AA+1],x,y,z-1),b1=g3(perm[BA+1],x-1,y,z-1),b2=g3(perm[AB+1],x,y-1,z-1),b3=g3(perm[BB+1],x-1,y-1,z-1);
  const c0=a0+(a1-a0)*u,c1=a2+(a3-a2)*u,d0=b0+(b1-b0)*u,d1=b2+(b3-b2)*u,e0=c0+(c1-c0)*w,e1=d0+(d1-d0)*w;return e0+(e1-e0)*s}
function fbm(x,y,o){let s=0,a=1,t=0;for(let i=0;i<o;i++){s+=n2(x,y)*a;t+=a;a*=.5;x*=2.03;y*=2.03}return s/t}
function hash2(x,z,s){let h=Math.imul(x,374761393)+Math.imul(z,668265263)+Math.imul(s+seed,1442695041)|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return(h>>>0)/4294967296}
function hash3(x,y,z){return hash2(x+Math.imul(y,7919),z-Math.imul(y,104729),y)}
const PLAINS=0,FOREST=1,DESERT=2,TUNDRA=3;

function terrain(x,z){

  gl.bindVertexArray(null);gl.disable(gl.BLEND);
}

// ====================================================================== sound
let ac=null,noiseBuf=null;
function initAudio(){if(ac)return;try{ac=new(window.AudioContext||window.webkitAudioContext)();noiseBuf=ac.createBuffer(1,ac.sampleRate*.3,ac.sampleRate);
  const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}catch(e){ac=null}}
function snd(type){if(!ac)return;const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain(),t=ac.currentTime;
  s.buffer=noiseBuf;f.type='lowpass';f.frequency.value=[420,900,260][type]*(0.85+Math.random()*.3);
  const vol=[.5,.45,.12][type],len=[.09,.16,.07][type];g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+len);
  s.connect(f);f.connect(g);g.connect(ac.destination);s.start(t);s.stop(t+len+.02)}

// ====================================================================== HUD
function icon(id){const c=document.createElement('canvas');c.width=c.height=48;const x=c.getContext('2d');x.imageSmoothingEnabled=false;
  const src=t=>[(t%16)*16,(t>>4)*16];
  if(KIND[id]===1){const s=src(SIDE[id]);x.drawImage(atlasC,s[0],s[1],16,16,4,4,40,40);return c}
  const f=(t,a,b,cc,d,e,g,dark)=>{const s=src(t);x.setTransform(a,b,cc,d,e,g);x.drawImage(atlasC,s[0],s[1],16,16,0,0,16,16);
    if(dark){x.globalCompositeOperation='source-atop';x.fillStyle='rgba(0,0,0,'+dark+')';x.fillRect(0,0,16,16);x.globalCompositeOperation='source-over'}};
  f(SIDE[id],20/16,10/16,0,22/16,4,14,.22);f(SIDE[id],20/16,-10/16,0,22/16,24,24,.42);f(TOP[id],20/16,10/16,-20/16,10/16,24,4,0);return c}
const hot=$('hotbar');let labelT=0;
function drawHotbar(){hot.innerHTML='';slots.forEach((id,i)=>{const d=document.createElement('div');d.className='slot'+(i===sel?' on':'');d.appendChild(icon(id));
  const pick=e=>{e.preventDefault();e.stopPropagation();if(i===sel&&touchMode)openInv();else setSel(i)};
  d.addEventListener('touchstart',pick,{passive:false});d.addEventListener('mousedown',pick);hot.appendChild(d)})}
function setSel(i){sel=(i+9)%9;drawHotbar();const l=$('label');l.textContent=NAME[slots[sel]];l.style.opacity=1;clearTimeout(labelT);labelT=setTimeout(()=>l.style.opacity=0,1400);saveDirty=true}
drawHotbar();
const grid=$('invgrid');
for(const id of PALETTE){const d=document.createElement('div');d.className='slot';d.title=NAME[id];d.appendChild(icon(id));
  d.addEventListener('click',()=>{slots[sel]=id;setSel(sel);closeInv()});grid.appendChild(d)}
function openInv(){if(!playing)return;invOpen=true;$('inv').style.display='flex';breaking=false;if(!touchMode&&document.pointerLockElement)document.exitPointerLock()}
function closeInv(){if(!invOpen)return;$('inv').style.display='none';invOpen=false;if(!touchMode)lock()}
$('invClose').addEventListener('click',closeInv);

// ====================================================================== input
function lock(){try{const p=canvas.requestPointerLock();if(p&&p.catch)p.catch(()=>{})}catch(e){}}
function start(){initAudio();if(ac&&ac.state==='suspended')ac.resume();$('menu').style.display='none';
  if(touchMode){playing=true;document.body.classList.add('touch')}else lock()}
function pause(){playing=false;breaking=false;for(const k in keys)keys[k]=false;joyX=joyY=0;$('menu').style.display='flex';$('play').textContent='Resume';doSave()}
document.addEventListener('pointerlockchange',()=>{if(touchMode)return;if(document.pointerLockElement===canvas){playing=true;$('menu').style.display='none'}else if(!invOpen)pause();else playing=true});
window.addEventListener('touchstart',()=>{if(!touchMode){touchMode=true;document.body.classList.add('touch');help()}},{passive:true,once:true});
$('play').addEventListener('click',start);
const rdl=()=>{$('rdl').textContent='View distance: '+RD};rdl();
$('rdm').addEventListener('click',()=>{RD=Math.max(3,RD-1);mkSpiral();rdl();saveDirty=true});
$('rdp').addEventListener('click',()=>{RD=Math.min(14,RD+1);mkSpiral();rdl();saveDirty=true});
let newArm=0;
$('neww').addEventListener('click',e=>{if(Date.now()-newArm<3000){try{localStorage.removeItem(SAVE)}catch(err){}window.removeEventListener('pagehide',doSave);noSave=true;location.reload()}
  else{newArm=Date.now();e.target.textContent='Tap again to erase this world';setTimeout(()=>e.target.textContent='New world',3000)}});
let noSave=false;
function help(){$('help').innerHTML=touchMode?
  'Left thumb: move · Right thumb: look<br>Tap: place block · Hold: break block<br>▲ jump / swim / fly up · FLY toggles flight<br>Tap the selected hotbar slot (or ▦) to choose blocks':
  'WASD move · Mouse look · Space jump / swim<br>Left click (hold): break · Right click: place · Middle click: pick block<br>1–9 or wheel: hotbar · E: all blocks · Shift: sprint<br>Double-tap Space: fly (Space up, Shift down) · Esc: pause'}
help();
let lastSpace=0;
document.addEventListener('keydown',e=>{
  if(e.code==='KeyE'&&!e.repeat){if(invOpen)closeInv();else openInv();return}
  if(!playing||invOpen)return;keys[e.code]=true;
  if(e.code==='Space'){e.preventDefault();if(!e.repeat){const n=performance.now();if(n-lastSpace<280){flying=!flying;P.vy=0;lastSpace=0}else lastSpace=n}}
  if(e.code.startsWith('Digit')){const n=+e.code.slice(5);if(n>=1&&n<=9)setSel(n-1)}
  if(e.code==='KeyF'&&!e.repeat){flying=!flying;P.vy=0}
});
document.addEventListener('keyup',e=>{keys[e.code]=false});
document.addEventListener('mousemove',e=>{if(document.pointerLockElement!==canvas)return;yaw-=e.movementX*.0024;pitch=Math.max(-1.55,Math.min(1.55,pitch-e.movementY*.0024))});
canvas.addEventListener('mousedown',e=>{if(touchMode)return;if(document.pointerLockElement!==canvas){if(!invOpen&&$('menu').style.display==='none')lock();return}
  if(e.button===0)breaking=true;else if(e.button===2)place();else if(e.button===1&&target){e.preventDefault();slots[sel]=target.b;setSel(sel)}});
document.addEventListener('mouseup',e=>{if(e.button===0)breaking=false});
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('wheel',e=>{if(playing&&!invOpen)setSel(sel+(e.deltaY>0?1:-1))},{passive:true});
// touch
let joyId=null,joyOx=0,joyOy=0,lookId=null,lookX=0,lookY=0,lookT=0,lookMoved=0,lookHold=false;
const joyEl=$('joy'),knob=$('knob');
canvas.addEventListener('touchstart',e=>{e.preventDefault();if(!playing)return;
  for(const t of e.changedTouches){
    if(t.clientX<innerWidth*.42&&joyId===null){joyId=t.identifier;joyOx=t.clientX;joyOy=t.clientY;joyEl.style.display='block';joyEl.style.left=joyOx+'px';joyEl.style.top=joyOy+'px';knob.style.transform=''}
    else if(lookId===null){lookId=t.identifier;lookX=t.clientX;lookY=t.clientY;lookT=performance.now();lookMoved=0;lookHold=false}}},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier===joyId){let dx=t.clientX-joyOx,dy=t.clientY-joyOy;const l=Math.hypot(dx,dy),m=52;if(l>m){dx*=m/l;dy*=m/l}joyX=dx/m;joyY=-dy/m;knob.style.transform=`translate(${dx}px,${dy}px)`}
    else if(t.identifier===lookId){const dx=t.clientX-lookX,dy=t.clientY-lookY;lookX=t.clientX;lookY=t.clientY;lookMoved+=Math.abs(dx)+Math.abs(dy);
      yaw-=dx*.0055;pitch=Math.max(-1.55,Math.min(1.55,pitch-dy*.0055))}}},{passive:false});
const tEnd=e=>{for(const t of e.changedTouches){
  if(t.identifier===joyId){joyId=null;joyX=joyY=0;joyEl.style.display='none'}
  else if(t.identifier===lookId){if(playing&&!lookHold&&lookMoved<12&&performance.now()-lookT<260)place();lookId=null;lookHold=false;breaking=false}}};
canvas.addEventListener('touchend',tEnd);canvas.addEventListener('touchcancel',tEnd);
function tbtn(id,downF,upF){const el=$(id);el.addEventListener('touchstart',e=>{e.preventDefault();e.stopPropagation();el.classList.add('act');downF()},{passive:false});
  const up=e=>{e.preventDefault();el.classList.remove('act');if(upF)upF()};el.addEventListener('touchend',up);el.addEventListener('touchcancel',up)}
tbtn('bJump',()=>{jumpHeld=true},()=>{jumpHeld=false});
tbtn('bDown',()=>{downHeld=true},()=>{downHeld=false});
tbtn('bFly',()=>{flying=!flying;P.vy=0});
tbtn('bInv',()=>openInv());
tbtn('bPause',()=>pause());
window.addEventListener('pagehide',()=>{if(!noSave)doSave()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&!noSave)doSave()});

// ====================================================================== main loop
let last=performance.now(),fpsT=0,fpsN=0,saveT=0;
function frame(t){
  const dt=Math.min(.05,(t-last)/1000);last=t;
  stream();
  if(touchMode&&lookId!==null&&!lookHold&&lookMoved<12&&t-lookT>280){lookHold=true;breaking=true}
  if(playing&&ready&&!invOpen)update(dt);else if(ready)dayT=(dayT+dt/720)%1;
  render();
  $('bDown').style.visibility=flying?'visible':'hidden';$('bFly').classList.toggle('act',flying);
  fpsN++;fpsT+=dt;if(fpsT>=.5){$('dbg').textContent=Math.round(fpsN/fpsT)+' fps  '+Math.floor(P.x)+' '+Math.floor(P.y)+' '+Math.floor(P.z)+(flying?'  flying':'');fpsN=0;fpsT=0}
  saveT+=dt;if(saveT>6){saveT=0;if(saveDirty&&!noSave)doSave()}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
